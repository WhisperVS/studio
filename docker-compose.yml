services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gaim
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d gaim -h localhost -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432" # you can remove this if the DB doesn't need host access
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    image: 13whisper13/studio-app:v1.1
    build: .
    pull_policy: always
    ports:
      - "9002:9002"
    environment:
      # If DATABASE_URL is not provided from the host environment, fall back to
      # a connection string that points at the `db` service. Inside Docker
      # containers, `localhost` refers to the container itself, so use the
      # service name (`db`) as the hostname.
      # Example Prisma format: postgresql://user:password@host:port/database
      DATABASE_URL: ${DATABASE_URL:-postgresql://user:password@db:5432/gaim}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
