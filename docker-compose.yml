services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gaim
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d gaim -h localhost -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5433:5432" # Changed to port 5433 to avoid conflicts
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    image: ${DOCKER_USERNAME:-whispervs}/gaim:${APP_VERSION:-0.1.0}
    build:
      context: .
      dockerfile: Dockerfile
      tags:
        - ${DOCKER_USERNAME:-whispervs}/gaim:${APP_VERSION:-0.1.0}
        - ${DOCKER_USERNAME:-whispervs}/gaim:latest
    ports:
      - "9002:9002"
    environment:
      # If DATABASE_URL is not provided from the host environment, fall back to
      # a connection string that points at the `db` service. Inside Docker
      # containers, `localhost` refers to the container itself, so use the
      # service name (`db`) as the hostname.
      # Example Prisma format: postgresql://user:password@host:port/database
      DATABASE_URL: ${DATABASE_URL:-postgresql://user:password@db:5432/gaim}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
